workflows:
  limoo-life-android:
    name: Limoo Life Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Install Gradle
        script: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "Gradle installed:"
          /tmp/gradle-9.3.1/bin/gradle --version
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: |
          /tmp/gradle-9.3.1/bin/gradle --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
